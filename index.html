<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Video Gallery Hover Play</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .gallery-container {
            padding-top: 30px;
          
            position: relative;
            width: 450px;
            height: 500px;
            perspective: 1400px;
            touch-action: pan-y;
        }

        .gallery {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.8s ease-in-out;
        }

        .gallery video {
            width: 320px;
            height: 400px;
            position: absolute;
            top: 10px;
            left: 10px;
            transform-origin: center;
            transition: transform 0.5s, opacity 0.5s;
            border-radius: 25px;
            box-shadow: 0px 10px 25px rgba(255, 255, 255, 0.3);
            opacity: 0.6;
            object-fit: cover;
        }

        .gallery video.active {
            transform: scale(1.5);
            opacity: 1;
            z-index: 10;
            margin-left: 20px;
        }

        .controls {
            margin-top: 50px;
            display: flex;
            margin-right: 30px;
            gap: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            color: white;
            background-color: #ff4d79;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #e6005c;
            transform: scale(1.1);
        }

        @media (max-width:500px) {
          
            .gallery-container {
                margin-top: 0px;
                width: 300px;
                height: 350px;
            }

            .gallery video {
                width: 220px;
                height: 300px;
            }

            .controls button {
                font-size: 12px;
                
            }
        }
    </style>
</head>

<body>

    <div class="gallery-container">
        <div class="gallery">
            <video src="vd1.mp4" style="transform: rotateY(0deg) translateZ(350px);" playsinline preload="auto"></video>
            <video src="vd2.mp4" style="transform: rotateY(60deg) translateZ(350px);" playsinline
                preload="auto"></video>
            <video src="vd3.mp4" style="transform: rotateY(120deg) translateZ(350px);" playsinline
                preload="auto"></video>
            <video src="vd4.mp4" style="transform: rotateY(180deg) translateZ(350px);" playsinline
                preload="auto"></video>
            <video src="vd5.mp4" style="transform: rotateY(240deg) translateZ(350px);" playsinline
                preload="auto"></video>
            <video src="vd6.mp4" style="transform: rotateY(300deg) translateZ(350px);" playsinline
                preload="auto"></video>
        </div>
    </div>

    <div class="controls">
        <button onclick="rotateGallery(-1)">⬅ Prev</button>
        <button onclick="rotateGallery(1)">Next ➡</button>
    </div>

    <script>
        let angle = 0;
        let currentIndex = 0;
        const videos = document.querySelectorAll(".gallery video");
        const gallery = document.querySelector(".gallery");

        function rotateGallery(direction) {
            angle += direction * 60;
            gallery.style.transform = `rotateY(${angle}deg)`;
            currentIndex = (currentIndex + direction + videos.length) % videos.length;

            videos.forEach((v, i) => {
                v.classList.toggle("active", i === currentIndex);
                v.pause(); // pastikan hanya video aktif yang nanti boleh main
            });
        }

        // 🎥 Putar video saat di-hover, pause yang lain
        videos.forEach(video => {
            video.addEventListener("mouseenter", () => {
                videos.forEach(v => {
                    if (v !== video) { v.pause(); v.currentTime = 0; }
                });
                video.play().catch(() => { });
            });
            video.addEventListener("mouseleave", () => {
                video.pause();
            });
        });

        // Keyboard navigasi
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") rotateGallery(1);
            else if (e.key === "ArrowLeft") rotateGallery(-1);
        });

        // Swipe gesture (mobile)
        let startX = 0;
        document.querySelector(".gallery-container").addEventListener("touchstart", (e) => {
            startX = e.touches[0].clientX;
        });
        document.querySelector(".gallery-container").addEventListener("touchend", (e) => {
            let endX = e.changedTouches[0].clientX;
            if (startX - endX > 50) rotateGallery(1);
            else if (endX - startX > 50) rotateGallery(-1);
        });
    </script>
</body>

</html>
